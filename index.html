  <script>
  (() => {
    const FONTS = {
      "Instrument Serif":   { size: 1.1, italic: true },
      "Space Mono":         { size: .8, weight: 700 },
      "Bebas Neue":         { size: 1.15 },
      "Pacifico":           { size: .8 },
      "UnifrakturMaguntia": { size: 1 },
      "Press Start 2P":     { size: .5 },
      "Monoton":            { size: .7 },
      "Rubik Glitch":       { size: .9 },
      "Caveat":             { size: 1.15, weight: 600 },
      "Abril Fatface":      { size: .95 },
      "Creepster":          { size: 1 },
      "Bungee Shade":       { size: .75 },
      "Silkscreen":         { size: .75 },
      "VT323":              { size: 1.15 },
      "Shrikhand":          { size: .9 },
      "Lobster":            { size: 1 },
      "Permanent Marker":   { size: .9 },
      "Major Mono Display": { size: .7 },
      "Rye":                { size: .85 },
      "Bowlby One":         { size: .8 },
      "Fascinate":          { size: .9 },
    };

    const WORDS = [
      "interesting", "weird", "useful", "dumb", "unique", "wonky", "goofy",
      "janky", "spicy", "funky", "absurd",
      "scrappy", "silly", "chaotic", "strange",
      { text: "big",      font: "Bowlby One", size: 1.05 },
      { text: "small",    font: "Silkscreen", size: .45 },
      { text: "tiny",     font: "Major Mono Display", size: .35 },
      { text: "cursed",   font: "UnifrakturMaguntia", hold: 1.2 },
      "unhinged",
      { text: "broken",   hold: 1.5 },
      { text: "REDACTED", fx: "redacted", font: "Space Mono", hold: 1.3 },
      { text: "explosive", font: "Bowlby One", hold: 1.2 },
      "corrupted",
    ].map(w => typeof w === "string" ? { text: w } : w)
     .map(w => ({ fx: w.text, ...w }));

    const fontNames = Object.keys(FONTS);
    const el = document.getElementById("w");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const abc = "abcdefghijklmnopqrstuvwxyz";
    const rand = n => Math.floor(Math.random() * n);

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?" + fontNames.map(n => {
      const f = FONTS[n], axis = f.italic ? ":ital@1" : f.weight ? `:wght@${f.weight}` : "";
      return "family=" + n.replace(/ /g, "+") + axis;
    }).join("&") + "&text=" + abc + abc.toUpperCase() + "&display=swap";
    link.onload = () => {
      if (!document.fonts) return;
      fontNames.forEach(n => {
        const f = FONTS[n];
        document.fonts.load(`${f.italic ? "italic " : ""}${f.weight || 400} 1em "${n}"`, abc + abc.toUpperCase()).catch(() => {});
      });
    };
    document.head.appendChild(link);

    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => String.fromCharCode(a + i));
    const UP = [...range(0x300, 0x315), ...range(0x33d, 0x344), "͆", ...range(0x34a, 0x34c),
                ...range(0x350, 0x352), "͗", "͛", ...range(0x363, 0x36f)];
    const MID = range(0x334, 0x338);
    const DOWN = [...range(0x316, 0x319), ...range(0x31c, 0x333), ...range(0x339, 0x33c), "ͅ",
                  ...range(0x347, 0x349), ...range(0x34d, 0x34e), ...range(0x353, 0x356), ...range(0x359, 0x35a)];
    const marks = (set, n) => Array.from({ length: n }, () => set[rand(set.length)]).join("");
    const curse = s => [...s].map(c => c + marks(UP, 7 + rand(12)) + marks(MID, rand(3)) + marks(DOWN, 7 + rand(12))).join("");
    const shuffle = a => {
      for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };
    // shuffled bag; on the first round, `early` items land somewhere in the first `within` draws
    const bag = (n, early = [], within = 7) => {
      let q = [], last = -1, first = true;
      return () => {
        if (!q.length) {
          q = shuffle([...Array(n).keys()]);
          if (n > 1 && q[n - 1] === last) [q[0], q[n - 1]] = [q[n - 1], q[0]];
          if (first) {
            first = false;
            const slots = shuffle(Array.from({ length: Math.min(within, n) }, (_, i) => n - 1 - i));
            early.forEach((v, k) => { const at = q.indexOf(v), to = slots[k]; [q[at], q[to]] = [q[to], q[at]]; });
          }
        }
        return last = q.pop();
      };
    };
    const nextWord = bag(WORDS.length, ["cursed", "corrupted"].map(t => WORDS.findIndex(w => w.text === t)));
    const nextFont = bag(fontNames.length);

    const setFont = (node, name, rel = 1) => {
      const f = FONTS[name];
      node.style.fontFamily = `"${name}"`;
      node.style.fontStyle = f.italic ? "italic" : "normal";
      node.style.fontWeight = f.weight || 400;
      node.style.fontSize = rel + "em";
    };
    const randomFont = () => fontNames[rand(fontNames.length)];

    const show = (text, name, size, fx = "") => {
      const base = size ?? FONTS[name].size;
      setFont(el, name, base);
      el.dataset.fx = fx;
      el.dataset.g = text;
      if (!fx) { el.textContent = text; return; }
      const cursed = fx === "cursed";
      if (fx === "weird") text = [...text].map((c, i) => i % 2 ? c.toUpperCase() : c).join("");
      if (fx === "redacted") text = `*${text}*`;
      const odd = rand(text.length);
      el.replaceChildren(...[...text].map((c, i) => {
        const s = document.createElement("span");
        s.textContent = cursed ? curse(c) : c;
        s.style.setProperty("--i", i);
        s.style.setProperty("--r", (Math.random() * 2 - 1).toFixed(2));
        s.style.setProperty("--q", (Math.random() * 2 - 1).toFixed(2));
        s.style.setProperty("--d", Math.random().toFixed(2));
        s.style.setProperty("--x", text.length > 1 ? (i / (text.length - 1) * 2 - 1).toFixed(2) : 0);
        if (cursed && Math.random() < .13) s.className = "void";
        if (fx === "chaotic" || fx === "scrappy" || (fx === "unique" && i === odd)) {
          const f = randomFont();
          setFont(s, f, FONTS[f].size / base);
          if (fx === "unique") s.className = "odd";
        }
        return s;
      }));
    };
    const junk = "█▓▒░#%&@$/\\|<>";
    const scramble = word => [...word].map(c => {
      const roll = Math.random();
      return roll < .25 ? junk[rand(junk.length)] : roll < .65 ? abc[rand(26)] : c;
    }).join("");

    const forced = WORDS.find(w => w.fx === new URLSearchParams(location.search).get("word"));
    const LIVE = { cursed: 140, chaotic: 180 };
    let haunt;

    // Effects that move the page work on look-alike copies in a click-through layer. The real
    // elements stay where they are (just made invisible), so links keep working in place.
    const SHOVE = ".handle, h1 .lead, h1 em, nav a, footer > *";
    const overlay = cls => {
      const layer = document.createElement("div");
      layer.className = cls;
      layer.setAttribute("aria-hidden", "true");
      document.body.appendChild(layer);
      return layer;
    };
    const pageParts = () => [document.querySelector("main"), document.querySelector("footer")]
      .map(n => ({ n, r: n.getBoundingClientRect() }));
    const copyPage = (layer, parts, dx = 0, dy = 0) => parts.map(({ n, r }) => {
      const c = n.cloneNode(true);
      c.classList.remove("fade");
      c.querySelectorAll(".fade").forEach(x => x.classList.remove("fade"));
      c.style.cssText = `position:absolute;margin:0;left:${r.left + dx}px;top:${r.top + dy}px;width:${r.width}px;height:${r.height}px;transform:none`;
      layer.appendChild(c);
      return c;
    });
    const conceal = (nodes, on) => nodes.forEach(n => on ? n.style.setProperty("opacity", "0", "important") : n.style.removeProperty("opacity"));

    // the word blows apart (letters via CSS); this adds the flash and shoves everything else away
    const explode = () => {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const flash = overlay("flash");
      flash.style.background = `radial-gradient(circle at ${cx}px ${cy}px, rgba(255, 220, 160, .5), rgba(255, 110, 30, .18) 18vmax, transparent 45vmax)`;
      flash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, easing: "ease-out" }).onfinish = () => flash.remove();

      if (busy) return;
      busy = true;
      const live = [...document.querySelectorAll(SHOVE)];
      const layer = overlay("ghosts");
      const [m] = copyPage(layer, pageParts());
      m.querySelector(".slot").style.visibility = "hidden"; // the real word keeps exploding underneath
      const copies = [...layer.querySelectorAll(SHOVE)];
      conceal(live, true);

      copies.forEach((t, i) => {
        const b = live[i].getBoundingClientRect();
        const dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
        const d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
        const p = Math.min(110, 12000 / d), spin = (Math.random() * 2 - 1) * 14;
        const at = (k, deg) => ({ translate: `${(ux * p * k).toFixed(1)}px ${(uy * p * k).toFixed(1)}px`, rotate: `${(spin * deg).toFixed(1)}deg` });
        t.animate([
          { ...at(0, 0), easing: "cubic-bezier(.1, .9, .2, 1)" },
          { ...at(1, 1), offset: .12, easing: "cubic-bezier(.5, 0, .3, 1)" },
          { ...at(-.12, -.3), offset: .55 },
          { ...at(.04, .1), offset: .8 },
          at(0, 0),
        ], { duration: 1400 });
      });
      setTimeout(() => { layer.remove(); conceal(live, false); busy = false; }, 1400);
    };

    // corrupted: the word turns to mojibake, the page drags to the bottom right leaving
    // copies behind like a hung window, then it segfaults and comes back
    const MOJI = ["Ã¶", "Ã©", "â€", "â€™", "ï¿½", "�", "Â", "Ã", "¤", "Ø", "ÿ", "¿"];
    const garble = s => [...s].map(c => Math.random() < .55 ? MOJI[rand(MOJI.length)] : c).join("");

    // after the segfault: a linux boot log floods past in bursts for ~1.5s
    const BOOT_MS = 1500;
    const pick = a => a[rand(a.length)];
    const hx = n => Array.from({ length: n }, () => "0123456789abcdef"[rand(16)]).join("");
    const bootLog = () => {
      let t = 0;
      const stamp = () => `[${(t += Math.random() < .08 ? Math.random() * .3 : Math.random() * .012).toFixed(6).padStart(12)}] `;
      const bus = () => `0000:${hx(2)}:${hx(2)}.${rand(8)}`;
      const KERNEL = [
        () => `pci ${bus()}: [${hx(4)}:${hx(4)}] type 00 class 0x${hx(6)}`,
        () => `pci ${bus()}: reg 0x${(16 + 4 * rand(6)).toString(16)}: [mem 0x${hx(8)}-0x${hx(8)} 64bit pref]`,
        () => `ACPI: ${pick(["SSDT", "DSDT", "FACP", "APIC", "HPET", "MCFG", "FPDT"])} 0x00000000${hx(8).toUpperCase()} 00${hx(4).toUpperCase()} (v02 ORDNLL ${hx(8).toUpperCase()})`,
        () => `usb ${1 + rand(4)}-${1 + rand(9)}: new high-speed USB device number ${2 + rand(14)} using xhci_hcd`,
        () => `usb ${1 + rand(4)}-${1 + rand(9)}: New USB device found, idVendor=${hx(4)}, idProduct=${hx(4)}, bcdDevice=${rand(9)}.${hx(2)}`,
        () => `input: ${pick(["AT Translated Set 2 keyboard", "Power Button", "Video Bus", "PC Speaker", "HDA Intel PCH Mic", "Logitech USB Receiver"])} as /devices/pci0000:00/0000:00:${hx(2)}.0/input/input${rand(30)}`,
        () => `ata${1 + rand(6)}: SATA link down (SStatus 0 SControl 300)`,
        () => `audit: type=1400 audit(1763${rand(1e6)}.${rand(999)}:${rand(99)}): apparmor="STATUS" operation="profile_load" name="${pick(["/usr/bin/man", "/usr/lib/snapd/snap-confine", "nvidia_modprobe", "lsb_release", "/usr/sbin/cupsd"])}" pid=${300 + rand(900)}`,
        () => `NET: Registered PF_${pick(["INET6", "PACKET", "NETLINK", "UNIX", "XDP"])} protocol family`,
        () => `clocksource: ${pick(["tsc", "hpet", "acpi_pm"])}: mask: 0xffffffffffffffff max_cycles: 0x${hx(10)}, max_idle_ns: ${rand(1e9)} ns`,
        () => `smpboot: CPU ${rand(16)} is up`,
        () => `PM: hibernation: Registered nosave memory: [mem 0x${hx(8)}-0x${hx(8)}]`,
        () => `iwlwifi 0000:${hx(2)}:00.0: loaded firmware version ${70 + rand(20)}.${hx(8)}.0 op_mode iwlmvm`,
        () => `snd_hda_intel 0000:00:1f.3: enabling device (0000 -> 0002)`,
        () => `nvme nvme0: ${rand(16)}/0/0 default/read/poll queues`,
        () => `EXT4-fs (nvme0n1p${1 + rand(3)}): mounted filesystem ${hx(8)}-${hx(4)}-${hx(4)}-${hx(4)}-${hx(12)} r/w with ordered data mode`,
        () => `Freeing unused kernel image (${pick(["initmem", "text/rodata gap", "rodata/data gap"])}) memory: ${rand(4096)}K`,
        () => `zswap: loaded using pool ${pick(["lzo", "zstd", "lz4"])}/zbud`,
        () => `i915 0000:00:02.0: [drm] GT${rand(2)}: GuC firmware i915/adlp_guc_70.bin version 70.${rand(40)}.${rand(9)}`,
      ];
      const UNITS = ["Journal Service", "Load Kernel Modules", "Apply Kernel Variables", "Create Static Device Nodes in /dev",
        "Rule-based Manager for Device Events and Files", "Network Manager", "WPA supplicant", "Avahi mDNS/DNS-SD Stack",
        "Login Service", "D-Bus System Message Bus", "Disk Manager", "Modem Manager", "CUPS Scheduler", "Bluetooth service",
        "Accounts Service", "Authorization Manager", "Power Profiles daemon", "Thermal Daemon Service", "Snap Daemon",
        "Hold until boot process finishes up", "GNOME Display Manager", "Daily apt download activities", "Permit User Sessions"];
      const lines = [
        stamp() + "Linux version 6.8.0-ordinall (buildd@ordinall) (gcc 13.2.0, GNU ld 2.42) #1 SMP PREEMPT_DYNAMIC",
        stamp() + "Command line: BOOT_IMAGE=/vmlinuz-6.8.0-ordinall root=UUID=" + hx(8) + "-" + hx(4) + " ro quiet splash",
        ...Array.from({ length: 170 }, () => stamp() + pick(KERNEL)()),
        stamp() + "systemd[1]: systemd 255 running in system mode (+PAM +AUDIT +SELINUX +APPARMOR +SECCOMP)",
        stamp() + "systemd[1]: Hostname set to <ordinall>.",
      ];
      UNITS.forEach(u => {
        if (Math.random() < .5) lines.push(`         Starting ${u.toLowerCase().replace(/ /g, "-")}.service - ${u}...`);
        lines.push(["OK", `${pick(["Started", "Started", "Finished", "Reached target", "Listening on", "Mounted"])} ${u}.`]);
      });
      lines.splice(lines.length - 3, 0, ["OK", "Started make.service - I make things."]);
      lines.push(["OK", "Reached target Graphical Interface."]);
      return lines;
    };
    const say = (term, ...lines) => {
      lines.forEach(line => {
        const d = document.createElement("div");
        if (Array.isArray(line)) {
          const ok = document.createElement("span");
          ok.className = "ok";
          ok.textContent = "  OK  ";
          d.append("[", ok, "] " + line[1]);
        } else d.textContent = line;
        term.appendChild(d);
      });
      term.scrollTop = term.scrollHeight;
    };
    // dumps lines in wildly uneven bursts (stalls, trickles, floods), loosely pacing itself to end at BOOT_MS
    const BURSTS = [
      { odds: .15, lines: () => 0,             wait: () => 140 + rand(200) }, // stall
      { odds: .25, lines: () => 1 + rand(2),   wait: () => 12 + rand(30) },   // trickle
      { odds: .35, lines: () => 3 + rand(10),  wait: () => 10 + rand(45) },   // stream
      { odds: .25, lines: () => 25 + rand(50), wait: () => 30 + rand(70) },   // flood
    ];
    const burst = () => {
      let roll = Math.random();
      return BURSTS.find(b => (roll -= b.odds) < 0) || BURSTS[BURSTS.length - 1];
    };
    const boot = (term, finish) => {
      const lines = bootLog(), start = performance.now();
      let shown = 0;
      say(term, "");
      const tick = () => {
        const f = (performance.now() - start) / BOOT_MS, lag = lines.length * Math.min(1, f) - shown;
        // way behind: flood; way ahead: stall; otherwise whatever the dice say
        const b = lag > 45 ? BURSTS[3] : lag < -35 ? BURSTS[Math.random() < .5 ? 0 : 1] : burst();
        const n = f >= 1 ? lines.length : b.lines();
        if (n) say(term, ...lines.slice(shown, shown = Math.min(shown + n, lines.length)));
        if (shown >= lines.length) return setTimeout(finish, 120);
        setTimeout(tick, b.wait());
      };
      tick();
    };

    const crash = (corrupt, done) => {
      const lead = document.querySelector("h1 .lead"), em = document.querySelector("h1 em");
      const restore = () => { lead.textContent = "I make"; em.textContent = "things."; };
      setTimeout(() => {
        corrupt();
        lead.textContent = garble("I make");
        em.textContent = garble("things.");
      }, 1000);
      if (busy) return setTimeout(() => { restore(); done(); }, 2800);
      busy = true;
      setTimeout(() => {
        const parts = pageParts(), live = parts.map(p => p.n);
        const layer = overlay("hang");
        copyPage(layer, parts);
        conceal(live, true);

        // any direction except within 30° of straight left/right
        const steps = 30, angle = (30 + Math.random() * 120 + (Math.random() < .5 ? 180 : 0)) * Math.PI / 180;
        const sx = Math.cos(angle) * innerWidth * .35 / steps, sy = Math.sin(angle) * innerHeight * .4 / steps;
        let x = 0, y = 0, t = 0;
        const drag = () => {
          const k = .4 + Math.random() * 1.2;
          x += sx * k + (Math.random() * 4 - 2);
          y += sy * k + (Math.random() * 4 - 2);
          copyPage(layer, parts, x, y);
          if (++t < steps) return setTimeout(drag, 20 + rand(45) + (Math.random() < .1 ? 150 : 0));
          setTimeout(() => {
            const term = overlay("segv");
            say(term, "Segmentation fault (core dumped)");
            setTimeout(() => boot(term, () => {
              term.remove();
              layer.remove();
              conceal(live, false);
              restore();
              busy = false;
              done();
            }), 900);
          }, 250);
        };
        drag();
      }, 1500);
    };

    // the timed meltdown waits until these have each been shown (and finished)
    const awaited = new Set(forced ? [] : ["cursed", "corrupted"]);
    let current, meltdownDue = false;

    const next = () => {
      clearInterval(haunt);
      if (current) awaited.delete(current.text);
      const w = current = forced || WORDS[nextWord()];
      const font = w.font || fontNames[nextFont()];
      const cursed = w.fx === "cursed";
      const settle = () => {
        show(w.text, font, w.size, w.fx);
        if (LIVE[w.fx] && !reduce) haunt = setInterval(() => show(w.text, font, w.size, w.fx), LIVE[w.fx]);
        if (w.fx === "explosive" && !reduce) setTimeout(explode, 600);
      };
      if (reduce) { settle(); return setTimeout(next, 2800); }
      const hold = () => setTimeout(next, (1700 + rand(900)) * (w.hold || 1));
      // a due meltdown fires with the word-change glitch, and the scramble lasts as long as it does
      const melt = meltdownDue && !busy;
      if (melt) { meltdownDue = false; meltdown(); }
      const steps = melt ? Math.ceil(MELTDOWN.length / 55) : 12;
      el.classList.add("glitch");
      let step = 0;
      const iv = setInterval(() => {
        if (++step < steps) {
          return show(scramble(w.text), cursed ? font : randomFont(), cursed ? w.size : undefined, cursed ? "cursed" : "");
        }
        clearInterval(iv);
        el.classList.remove("glitch");
        settle();
        if (w.fx === "corrupted") return crash(() => show(garble(w.text), font, w.size, w.fx), next);
        hold();
      }, 55);
    };
    setTimeout(() => { el.parentElement.classList.remove("off"); next(); }, 3000);

    const MELTDOWN = { min: 10000, max: 20000, length: 1000, clickLength: 750 };

    let busy = false;

    const meltdown = (length = MELTDOWN.length) => {
      if (busy) return;
      busy = true;
      const root = document.documentElement;
      const main = document.querySelector("main");
      const footer = document.querySelector("footer");
      const jitter = () => (Math.random() * 2 - 1);
      const layer = document.createElement("div");
      layer.id = "meltdown";
      layer.setAttribute("aria-hidden", "true");

      const rowH = Math.max(22, Math.round(innerHeight / 16));
      const size = rowH * .82;
      const line = word => `${word} `.repeat(Math.ceil(innerWidth / (size * .45 * (word.length + 1))) + 3);
      const base = line("make");
      const rows = Array.from({ length: Math.ceil(innerHeight / rowH) + 2 }, () => {
        const r = document.createElement("div");
        r.className = "row";
        r.style.height = rowH + "px";
        r.style.fontSize = size + "px";
        r.textContent = base;
        layer.appendChild(r);
        return r;
      });
      root.appendChild(layer);

      const junk = "█▓▒░_/|#=";
      const corrupt = s => [...s].map(c => c !== " " && Math.random() < .2 ? junk[rand(junk.length)] : c).join("");

      let tears = [];
      const tear = () => {
        tears.forEach(t => t.remove());
        tears = [];
        const rect = main.getBoundingClientRect();
        for (let k = rand(4); k > 0; k--) {
          const y = rand(rect.height);
          const h = 4 + rand(Math.max(8, rect.height / 5));
          const t = document.createElement("div");
          t.className = "tear";
          t.setAttribute("aria-hidden", "true");
          t.style.top = rect.top + y + "px";
          t.style.height = h + "px";
          const clone = main.cloneNode(true);
          clone.querySelectorAll(".fade").forEach(n => n.classList.remove("fade"));
          clone.style.cssText = `position:absolute;margin:0;left:${rect.left + jitter() * 80}px;top:${-y}px;width:${rect.width}px;height:${rect.height}px;transform:none`;
          t.appendChild(clone);
          const roll = Math.random();
          if (roll < .25) t.style.filter = "invert(1)";
          else if (roll < .6) t.style.textShadow = `${4 + rand(6)}px 0 rgba(255,0,80,.85), -${4 + rand(6)}px 0 rgba(0,220,255,.85)`;
          root.appendChild(t);
          tears.push(t);
        }
      };

      const frame = () => {
        if (Math.random() < .18) return;
        rows.forEach(r => {
          const roll = Math.random();
          r.style.transform = roll < .3 ? `translateX(${jitter() * size * 3}px)` : roll < .38 ? `translateX(${jitter() * size * 12}px) scaleY(${.3 + Math.random()})` : "none";
          r.style.opacity = Math.random() < .15 ? 0 : 1;
          r.style.color = Math.random() < .07 ? "var(--fg)" : "";
          r.textContent = Math.random() < .45 ? corrupt(base) : base;
        });
        layer.style.transform = Math.random() < .25 ? `translateY(${jitter() * rowH * 3}px)` : "none";
        const split = 1 + rand(5);
        layer.style.textShadow = `${split}px 0 rgba(255,0,80,.6), -${split}px 0 rgba(0,220,255,.6)`;
        main.style.translate = Math.random() < .35 ? `${jitter() * 14}px 0` : "";
        footer.style.translate = Math.random() < .2 ? `${jitter() * 10}px 0` : "";
        tear();
      };

      root.classList.add("meltdown");
      frame();
      const iv = setInterval(frame, 38);

      setTimeout(() => {
        clearInterval(iv);
        tears.forEach(t => t.remove());
        layer.remove();
        main.style.translate = footer.style.translate = "";
        root.classList.remove("meltdown");
        busy = false;
      }, length);
    };

    if (!reduce) {
      let clicks = [];
      el.parentElement.addEventListener("click", () => {
        const now = performance.now();
        clicks = clicks.filter(t => now - t < 1500).concat(now);
        if (clicks.length >= 5) { clicks = []; meltdown(MELTDOWN.clickLength); }
      });

      setTimeout(function go() {
        if (document.hidden) return document.addEventListener("visibilitychange", go, { once: true });
        if (busy || (awaited.size && !location.search.includes("meltdown"))) return setTimeout(go, 800);
        meltdownDue = true;
      }, location.search.includes("meltdown") ? 1500 : MELTDOWN.min + rand(MELTDOWN.max - MELTDOWN.min));
    }
  })();
  </script>

    <span>Abdullah Ansari</span>
