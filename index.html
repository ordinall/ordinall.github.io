  body {

    <nav class="fade d3">

    </nav>
  </main>
  <script>
  (() => {
    const words = [
      "interesting", "weird", "big", "small", "useful", "dumb", "unique",
      "wonky", "cursed", "goofy", "janky", "bonkers", "feral", "spicy", "wobbly",
      "sneaky", "funky", "absurd", "scrappy", "crunchy", "silly", "chaotic",
      "shiny", "tiny", "strange", "fancy", "clever", "unhinged", "squishy", "cozy",
    ];
    // family, style, weight, size scale (evens out very different font metrics)
    const fonts = [
      ['"Instrument Serif"', "italic", 400, 1.1],
      ['"Space Mono"', "normal", 700, .8],
      ['"Bebas Neue"', "normal", 400, 1.15],
      ['"Pacifico"', "normal", 400, .8],
      ['"UnifrakturMaguntia"', "normal", 400, 1],
      ['"Press Start 2P"', "normal", 400, .5],
      ['"Monoton"', "normal", 400, .7],
      ['"Rubik Glitch"', "normal", 400, .9],
      ['"Caveat"', "normal", 600, 1.15],
      ['"Abril Fatface"', "normal", 400, .95],
    ];
    const el = document.getElementById("w");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const abc = "abcdefghijklmnopqrstuvwxyz";
    const rand = n => Math.floor(Math.random() * n);
    // shuffle bag: random order, every item used once before any repeats,
    // and never the same item twice in a row across reshuffles
    const bag = n => {
      let q = [], last = -1;
      return () => {
        if (!q.length) {
          q = [...Array(n).keys()];
          for (let i = n - 1; i > 0; i--) { const j = rand(i + 1); [q[i], q[j]] = [q[j], q[i]]; }
          if (n > 1 && q[n - 1] === last) [q[0], q[n - 1]] = [q[n - 1], q[0]];
        }
        return last = q.pop();
      };
    };
    const nextWord = bag(words.length), nextFont = bag(fonts.length);

    fonts.forEach(([f, s, w]) => document.fonts && document.fonts.load(`${s} ${w} 1em ${f}`, abc).catch(() => {}));

    const show = (text, i) => {
      const [f, s, w, z] = fonts[i];
      el.textContent = text;
      el.style.fontFamily = f;
      el.style.fontStyle = s;
      el.style.fontWeight = w;
      el.style.fontSize = z + "em";
    };
    const scramble = word => [...word].map(c => Math.random() < .6 ? abc[rand(26)] : c).join("");

    let wi = nextWord(), fi = nextFont();
    show(words[wi], fi);

    const next = () => {
      wi = nextWord();
      fi = nextFont();
      if (reduce) { show(words[wi], fi); return setTimeout(next, 2800); }
      el.classList.add("glitch");
      let step = 0;
      const iv = setInterval(() => {
        if (++step < 9) return show(scramble(words[wi]), rand(fonts.length));
        clearInterval(iv);
        show(words[wi], fi);
        el.classList.remove("glitch");
        setTimeout(next, 1700 + rand(900));
      }, 55);
    };
    setTimeout(next, 2200);
  })();
  </script>
