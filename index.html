  #w.glitch {
    text-shadow: .04em 0 rgba(255, 0, 90, .75), -.04em 0 rgba(0, 210, 255, .75);

  @keyframes jitter {

  #w[data-fx="interesting"] span { animation: glint 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * .08s); }
  @keyframes glint { 0%, 30%, 100% { color: var(--fg); transform: none; } 15% { color: var(--accent); transform: translateY(-.08em); } }

  #w[data-fx="weird"] span { animation: float 2.4s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.4s); }
  @keyframes float {
    from { transform: translateY(calc(var(--r) * .12em)) rotate(calc(var(--q) * 8deg)); }

  @keyframes type { to { opacity: 1; } }
  @keyframes caret { 50% { opacity: 0; } }

  #w[data-fx="dumb"] span:last-child { transform-origin: 0 90%; animation: topple 2.2s ease-in-out infinite; }
  @keyframes topple { 0%, 25%, 100% { transform: none; } 45%, 80% { transform: rotate(80deg) translateY(.06em); } }

  #w[data-fx="unique"] .odd { color: var(--accent); }

  #w[data-fx="wonky"] span { transform: rotate(calc(var(--r) * 16deg)) translateY(calc(var(--q) * .1em)); }

  #w[data-fx="goofy"] span { animation: boing .45s cubic-bezier(.3, 0, .6, 1) infinite alternate; animation-delay: calc(var(--i) * -.12s); }
  @keyframes boing { from { transform: translateY(.08em) scale(1.08, .9); } to { transform: translateY(-.16em) scale(.94, 1.08); } }

  #w[data-fx="janky"] span { animation: jank .5s steps(1) infinite; animation-delay: calc(var(--i) * -.13s); }
  @keyframes jank {
    0%  { transform: none; }
    25% { transform: translate(.04em, -.06em) rotate(4deg); }
    50% { transform: translate(-.03em, .04em); }
    75% { transform: translate(.02em, .03em) rotate(-5deg); }

  @keyframes heat {

  @keyframes shiver { 50% { transform: translateY(-.02em); } }

  @keyframes rainbow { 0%, 100% { color: #ff4d6d; } 20% { color: #ffb703; } 40% { color: #3ddc97; } 60% { color: #4cc9f0; } 80% { color: #9d4edd; } }

  #w[data-fx="absurd"] span:nth-child(even) { animation-direction: reverse; }
  @keyframes flip { 0%, 30% { transform: none; } 50%, 80% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }

  #w[data-fx="scrappy"] span {
    margin: 0 .02em; padding: 0 .07em; background: var(--fg); color: var(--bg);

  #w[data-fx="scrappy"] span:nth-child(3n) { background: var(--accent); }
  #w[data-fx="scrappy"] span:nth-child(3n+1) { background: transparent; color: var(--fg); outline: 1px solid var(--line); }

  #w[data-fx="silly"] span { animation: rock .38s ease-in-out infinite alternate; }
  #w[data-fx="silly"] span:nth-child(even) { animation-direction: alternate-reverse; }
  @keyframes rock { from { transform: rotate(-14deg) translateY(.04em); } to { transform: rotate(14deg) translateY(-.07em); } }

  #w[data-fx="chaotic"] span { transform: rotate(calc(var(--r) * 12deg)); }

  @keyframes swell { 50% { transform: scale(1.15); } }

  #w[data-fx="small"] { animation: shrink 1.6s ease-in-out infinite; }

  #w[data-fx="cursed"] { color: #c1121f; text-shadow: 0 0 .2em rgba(193, 18, 31, .45); }

  }

    #w, #w span { animation: none !important; }
    #w[data-fx="useful"] span { opacity: 1; }
  }

  main, footer { position: relative; z-index: 1; }
  #meltdown {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;

  nav { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; position: relative; }

  .arrow { display: inline-block; color: var(--muted); transition: transform .3s, color .3s; }
  nav a:hover .arrow, nav a:focus-visible .arrow { transform: translate(2px, -2px); color: var(--fg); }
  .tip {
    position: absolute; top: calc(100% + 1.25rem); left: 50%;
    width: max-content; max-width: min(90vw, 28rem);
    color: var(--muted); font-size: .95rem;
    opacity: 0; transform: translate(-50%, -4px); pointer-events: none;

  nav a:hover .tip, nav a:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  a:focus-visible { outline: none; }
  footer {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: .5rem 1.25rem; color: var(--muted); font-size: 13px;
  }
  footer .sep { width: 1px; height: 12px; background: var(--line); }
  footer a { color: var(--muted); text-decoration: none; transition: color .3s; }
  footer a:hover, footer a:focus-visible { color: var(--fg); }

  .fade { opacity: 0; transform: translateY(6px); animation: in 1s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
  @keyframes in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; transform: none; } }
</style>

  <script>
  (() => {
    const FONTS = {
      "Instrument Serif":   { size: 1.1, italic: true },
      "Space Mono":         { size: .8, weight: 700 },
      "Bebas Neue":         { size: 1.15 },
      "Pacifico":           { size: .8 },
      "UnifrakturMaguntia": { size: 1 },
      "Press Start 2P":     { size: .5 },
      "Monoton":            { size: .7 },
      "Rubik Glitch":       { size: .9 },
      "Caveat":             { size: 1.15, weight: 600 },
      "Abril Fatface":      { size: .95 },
      "Creepster":          { size: 1 },
      "Nosifer":            { size: .6 },
      "Bungee Shade":       { size: .75 },
      "Silkscreen":         { size: .75 },
      "VT323":              { size: 1.15 },
      "Shrikhand":          { size: .9 },
      "Lobster":            { size: 1 },
      "Permanent Marker":   { size: .9 },
      "Rubik Wet Paint":    { size: .85 },
      "Major Mono Display": { size: .7 },
      "Rye":                { size: .85 },
      "Bowlby One":         { size: .8 },
      "Fascinate":          { size: .9 },
    };

    const WORDS = [
      "interesting", "weird", "useful", "dumb", "unique", "wonky", "goofy",
      "janky", "spicy", "funky", "absurd",
      "scrappy", "silly", "chaotic", "strange",
      { text: "big",      font: "Bowlby One", size: 1.05 },
      { text: "small",    font: "Silkscreen", size: .45 },
      { text: "tiny",     font: "Major Mono Display", size: .35 },
      { text: "cursed",   font: "UnifrakturMaguntia" },
      { text: "unhinged", font: "Nosifer" },
    ].map(w => typeof w === "string" ? { text: w } : w)
     .map(w => ({ fx: w.text, ...w }));

    const fontNames = Object.keys(FONTS);
    const el = document.getElementById("w");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const abc = "abcdefghijklmnopqrstuvwxyz";
    const rand = n => Math.floor(Math.random() * n);

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?" + fontNames.map(n => {
      const f = FONTS[n], axis = f.italic ? ":ital@1" : f.weight ? `:wght@${f.weight}` : "";
      return "family=" + n.replace(/ /g, "+") + axis;
    }).join("&") + "&text=" + abc + abc.toUpperCase() + "&display=swap";
    document.head.appendChild(link);

    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => String.fromCharCode(a + i));
    const UP = [...range(0x300, 0x315), ...range(0x33d, 0x344), "͆", ...range(0x34a, 0x34c),
                ...range(0x350, 0x352), "͗", "͛", ...range(0x363, 0x36f)];
    const MID = range(0x334, 0x338);
    const DOWN = [...range(0x316, 0x319), ...range(0x31c, 0x333), ...range(0x339, 0x33c), "ͅ",
                  ...range(0x347, 0x349), ...range(0x34d, 0x34e), ...range(0x353, 0x356), ...range(0x359, 0x35a)];
    const marks = (set, n) => Array.from({ length: n }, () => set[rand(set.length)]).join("");
    const curse = s => [...s].map(c => c + marks(UP, 2 + rand(5)) + marks(MID, rand(2)) + marks(DOWN, 2 + rand(5))).join("");
    const bag = n => {
      let q = [], last = -1;
      return () => {
        if (!q.length) {
          q = [...Array(n).keys()];
          for (let i = n - 1; i > 0; i--) { const j = rand(i + 1); [q[i], q[j]] = [q[j], q[i]]; }
          if (n > 1 && q[n - 1] === last) [q[0], q[n - 1]] = [q[n - 1], q[0]];
        }
        return last = q.pop();
      };
    };
    const nextWord = bag(WORDS.length), nextFont = bag(fontNames.length);

    const setFont = (node, name, rel = 1) => {
      const f = FONTS[name];
      node.style.fontFamily = `"${name}"`;
      node.style.fontStyle = f.italic ? "italic" : "normal";
      node.style.fontWeight = f.weight || 400;
      node.style.fontSize = rel + "em";
    };
    const randomFont = () => fontNames[rand(fontNames.length)];

    const show = (text, name, size, fx = "") => {
      const base = size ?? FONTS[name].size;
      setFont(el, name, base);
      el.dataset.fx = fx;
      if (!fx || fx === "cursed") { el.textContent = fx ? curse(text) : text; return; }
      if (fx === "weird") text = [...text].map((c, i) => i % 2 ? c.toUpperCase() : c).join("");
      const odd = rand(text.length);
      el.replaceChildren(...[...text].map((c, i) => {
        const s = document.createElement("span");
        s.textContent = c;
        s.style.setProperty("--i", i);
        s.style.setProperty("--r", (Math.random() * 2 - 1).toFixed(2));
        s.style.setProperty("--q", (Math.random() * 2 - 1).toFixed(2));
        if (fx === "chaotic" || fx === "scrappy" || (fx === "unique" && i === odd)) {
          const f = randomFont();
          setFont(s, f, FONTS[f].size / base);
          if (fx === "unique") s.className = "odd";
        }
        return s;
      }));
    };
    const scramble = word => [...word].map(c => Math.random() < .6 ? abc[rand(26)] : c).join("");

    const LIVE = { cursed: 140, chaotic: 180 };
    let haunt;

    const next = () => {
      clearInterval(haunt);
      const w = WORDS[nextWord()];
      const font = w.font || fontNames[nextFont()];
      const cursed = w.fx === "cursed";
      const settle = () => {
        show(w.text, font, w.size, w.fx);
        if (LIVE[w.fx] && !reduce) haunt = setInterval(() => show(w.text, font, w.size, w.fx), LIVE[w.fx]);
      };
      if (reduce) { settle(); return setTimeout(next, 2800); }
      el.classList.add("glitch");
      let step = 0;
      const iv = setInterval(() => {
        if (++step < 9) {
          return show(scramble(w.text), randomFont(), undefined, cursed ? "cursed" : "");
        }
        clearInterval(iv);
        el.classList.remove("glitch");
        settle();
        setTimeout(next, 1700 + rand(900));
      }, 55);
    };
    setTimeout(() => { el.parentElement.classList.remove("off"); next(); }, 3000);

    const MELTDOWN = { min: 10000, max: 20000, length: 1500, clickLength: 750 };

    let melting = false;

    const meltdown = (length = MELTDOWN.length) => {
      if (melting) return;
      melting = true;
      const root = document.documentElement;
      const main = document.querySelector("main");
      const footer = document.querySelector("footer");
      const jitter = () => (Math.random() * 2 - 1);
      const layer = document.createElement("div");
      layer.id = "meltdown";
      layer.setAttribute("aria-hidden", "true");

      const rowH = Math.max(22, Math.round(innerHeight / 16));
      const size = rowH * .82;
      const line = word => `${word} `.repeat(Math.ceil(innerWidth / (size * .45 * (word.length + 1))) + 3);
      let base = line("make");
      const rows = Array.from({ length: Math.ceil(innerHeight / rowH) + 2 }, () => {
        const r = document.createElement("div");
        r.className = "row";
        r.style.height = rowH + "px";
        r.style.fontSize = size + "px";
        r.textContent = base;
        layer.appendChild(r);
        return r;
      });
      root.appendChild(layer);

      const junk = "█▓▒░_/|#=";
      const corrupt = s => [...s].map(c => c !== " " && Math.random() < .2 ? junk[rand(junk.length)] : c).join("");

      let tears = [];
      const tear = () => {
        tears.forEach(t => t.remove());
        tears = [];
        const rect = main.getBoundingClientRect();
        for (let k = rand(4); k > 0; k--) {
          const y = rand(rect.height);
          const h = 4 + rand(Math.max(8, rect.height / 5));
          const t = document.createElement("div");
          t.className = "tear";
          t.setAttribute("aria-hidden", "true");
          t.style.top = rect.top + y + "px";
          t.style.height = h + "px";
          const clone = main.cloneNode(true);
          clone.querySelectorAll(".fade").forEach(n => n.classList.remove("fade"));
          clone.style.cssText = `position:absolute;margin:0;left:${rect.left + jitter() * 80}px;top:${-y}px;width:${rect.width}px;height:${rect.height}px;transform:none`;
          t.appendChild(clone);
          const roll = Math.random();
          if (roll < .25) t.style.filter = "invert(1)";
          else if (roll < .6) t.style.textShadow = `${4 + rand(6)}px 0 rgba(255,0,80,.85), -${4 + rand(6)}px 0 rgba(0,220,255,.85)`;
          root.appendChild(t);
          tears.push(t);
        }
      };

      const frame = () => {
        if (Math.random() < .18) return;
        rows.forEach(r => {
          const roll = Math.random();
          r.style.transform = roll < .3 ? `translateX(${jitter() * size * 3}px)` : roll < .38 ? `translateX(${jitter() * size * 12}px) scaleY(${.3 + Math.random()})` : "none";
          r.style.opacity = Math.random() < .15 ? 0 : 1;
          r.style.color = Math.random() < .07 ? "var(--fg)" : "";
          r.textContent = Math.random() < .45 ? corrupt(base) : base;
        });
        layer.style.transform = Math.random() < .25 ? `translateY(${jitter() * rowH * 3}px)` : "none";
        const split = 1 + rand(5);
        layer.style.textShadow = `${split}px 0 rgba(255,0,80,.6), -${split}px 0 rgba(0,220,255,.6)`;
        main.style.translate = Math.random() < .35 ? `${jitter() * 14}px 0` : "";
        footer.style.translate = Math.random() < .2 ? `${jitter() * 10}px 0` : "";
        tear();
      };

      root.classList.add("meltdown");
      frame();
      const iv = setInterval(frame, 38);
      setTimeout(() => {
        base = line("things");
        rows.forEach(r => { r.textContent = base; });
      }, length / 2);

      setTimeout(() => {
        clearInterval(iv);
        tears.forEach(t => t.remove());
        layer.remove();
        main.style.translate = footer.style.translate = "";
        root.classList.remove("meltdown");
        melting = false;
      }, length);
    };

    if (!reduce) {
      let clicks = [];
      el.parentElement.addEventListener("click", () => {
        const now = performance.now();
        clicks = clicks.filter(t => now - t < 1500).concat(now);
        if (clicks.length >= 5) { clicks = []; meltdown(MELTDOWN.clickLength); }
      });

      setTimeout(function go() {
        if (document.hidden) return document.addEventListener("visibilitychange", go, { once: true });
        meltdown();
      }, location.search.includes("meltdown") ? 1500 : MELTDOWN.min + rand(MELTDOWN.max - MELTDOWN.min));
    }
  })();
  </script>
